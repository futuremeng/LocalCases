<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LocalCases</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="sr-only">LocalCases 判决文书本地检索</h1>
<header data-tauri-drag-region>
  <form id="searchform" autocomplete="off">
    <label class="sr-only" for="q">检索关键词</label>
    <input id="q" type="search" placeholder="关键词、案号或当事人" spellcheck="false">
    <label class="sr-only" for="sort">排序</label>
    <select id="sort">
      <option value="relevance">相关度</option>
      <option value="date">裁判日期</option>
      <option value="id">导入顺序</option>
    </select>
    <button type="submit">搜索</button>
    <button id="export" type="button" aria-label="导出当前筛选结果为 CSV" title="导出当前筛选结果">导出 CSV</button>
  </form>
  <p id="status" role="status" aria-live="polite">正在启动本地索引…</p>
  <p id="libstate"></p>
</header>

<div id="chips" aria-label="已应用的筛选"></div>

<main>
  <aside id="facets" aria-label="筛选"></aside>
  <section id="results" aria-label="检索结果"></section>
</main>

<section id="detail" role="dialog" aria-labelledby="detail-title" hidden>
  <div class="detail-head">
    <button id="close" type="button">关闭</button>
  </div>
  <div id="detailbody"></div>
</section>

<footer>
  <button id="prev" type="button">上一页</button>
  <span id="page"></span>
  <button id="next" type="button">下一页</button>
  <button id="cursor" type="button" title="切换到按导入顺序连续浏览，深页更快">浏览更多</button>
</footer>

<script src="app.js"></script>
</body>
</html>
