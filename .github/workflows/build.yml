# The checks this repository already makes by hand, on every push: the unit tests,
# the bundled dataset through the real pipeline, the service answering the query the
# README promises, and a bundle per platform. Nothing here is a new kind of check —
# SPEC §7 is what runs.
#
# The contract assertions read the numbers out of the source (`src/lib.rs`,
# `Cargo.toml`) rather than repeating them here, the same way
# `tools/check_dataset.py` reads the stored columns out of `convert.rs`. A bumped
# `SCHEMA` or version therefore needs no edit in this file; a contract that stopped
# matching the source does.

name: build

on:
  push:
    branches: [main]
    # A tag is how a release gets cut. The same six jobs run there as on a push,
    # because a binary published from a tree that fails a check is worse than no
    # binary; the release job at the bottom is the only thing that behaves
    # differently, and it refuses a tag the manifests do not agree with.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
          - os: macos-latest
            exe: ''
          - os: windows-latest
            exe: '.exe'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # rust-version is 1.92 and every runner's stable is newer, so the version is
      # printed rather than pinned: a runner that fell behind the manifest fails in
      # the build step, not somewhere quieter.
      - name: toolchain
        run: rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-engine-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: format
        run: cargo fmt --check

      - name: unit tests
        run: cargo test --release --locked

      - name: binaries
        run: cargo build --release --locked

      # The manifest that ships inside a bundle has to match the lockfile it was
      # built from. `cargo fetch` comes first: a host build only downloads the
      # crates of its own target, and the license of a Windows- or macOS-only crate
      # lives in its packaged manifest, which is the only place this reads it from.
      - name: third-party licenses match the lockfile
        run: |
          cargo fetch --locked
          python3 tools/licenses.py --check

      # The whole pipeline on the corpus the repository ships: seconds rather than
      # minutes, and it ends with the dataset checked against its own manifest.
      # Every path is relative to this step's directory: on Windows the runner's
      # bash reports $PWD as /d/a/..., which Rust then reads as a missing path.
      - name: import, index and self-check the bundled dataset
        run: |
          mkdir -p work
          cat > work/ci.toml <<TOML
          db = "work/library"
          index_path = "work/index"
          addr = "127.0.0.1:5010"
          index_with_full_text = true
          raw_data_path = "data/guiding-cases"
          TOML
          ./target/release/convert${{ matrix.exe }} work/ci.toml --compact
          ./target/release/index${{ matrix.exe }} work/ci.toml
          ./target/release/check${{ matrix.exe }} work/ci.toml
          python3 tools/check_dataset.py

      - name: the service answers what the README says it answers
        run: |
          ./target/release/serve${{ matrix.exe }} work/ci.toml > serve.log 2>&1 &
          serve_pid=$!
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5010/api/health > health.json; then break; fi
            sleep 0.5
          done
          # a service that never answered is its own failure, with its own log
          if [ ! -s health.json ]; then cat serve.log; exit 1; fi
          python3 - <<'PY'
          import json
          import re
          import tomllib

          health = json.load(open("health.json"))
          print(health)
          schema = int(re.search(r"SCHEMA: u32 = (\d+)", open("src/lib.rs").read()).group(1))
          version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          assert health["ok"], health
          assert health["schema"] == schema, (health, schema)
          assert health["version"] == version, (health, version)
          assert health["indexed_documents"] == 279, health
          PY
          # The query is Chinese, so it goes out from Python and not curl: on a
          # Windows runner curl is the system build, which takes its arguments in the
          # ANSI code page, so a UTF-8 term reaches the service as mojibake -- 0 hits
          # against an index that /api/health says holds 279 documents.
          python3 - <<'PY'
          import json
          import sys
          import urllib.parse
          import urllib.request

          # a Windows console is cp1252 and cannot print the term being searched;
          # this is the same guard tools/check_dataset.py needed for the same reason
          if hasattr(sys.stdout, "reconfigure"):
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          query = "证据保全"
          url = "http://127.0.0.1:5010/api/search?" + urllib.parse.urlencode(
              {"search": query, "size": 1}
          )
          found = json.load(urllib.request.urlopen(url))
          print(query, "->", found["search_meta"]["total"], "hits")
          assert found["search_meta"]["total"] == 5, found
          PY
          kill "$serve_pid"

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One bundle format per platform, the one that needs no network to build:
          # the shell writes the .deb itself, while the .AppImage would download
          # linuxdeploy. macOS and Windows take the bundle the README names there.
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: msi
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Tauri's system dependencies, the list the README gives for Debian/Ubuntu.
      # Without them the build stops inside a C build script, not in this code.
      - name: system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            desktop/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('desktop/Cargo.lock') }}

      # Ubuntu runners ship a cargo-tauri in the image, and cargo install refuses to
      # overwrite a binary it did not put there.
      - name: tauri-cli
        run: cargo install tauri-cli --locked --version "^2" --force

      # The version assertion lives in desktop/build.rs: it compares
      # tauri.conf.json, desktop/Cargo.toml and the engine's Cargo.toml and stops
      # the build when they differ. This step is where it runs.
      - name: check the shell
        working-directory: desktop
        run: cargo check --locked

      # The desktop tree is a separate workspace with its own dependency graph, so
      # it carries its own manifest into the bundle -- and its own check that the
      # manifest matches the lockfile it was resolved from.
      - name: the licenses the bundle will carry
        working-directory: desktop
        run: |
          cargo fetch --locked
          python3 ../tools/licenses.py --check

      # `tauri bundle` only wraps binaries that already exist; `tauri build` is the
      # one that compiles them first.
      - name: bundle
        working-directory: desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      # A .app is a directory and a release asset is a file, so macOS hands over
      # the zip `ditto` is meant to produce -- `--keepParent` keeps the .app itself
      # inside it, which is what a reader drags onto Applications.
      - name: stage the bundle
        working-directory: desktop/target/release/bundle
        run: |
          if [ "$(uname)" = Darwin ]; then
            app=(macos/*.app)
            ditto -c -k --keepParent "${app[0]}" "${app[0]}.zip"
          fi

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalCases-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/macos/*.zip
            desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # A tag is a version claim, so it is checked against the manifests the same
      # way the build script checks the manifests against each other: v0.4.0 on a
      # tree whose Cargo.toml says 0.3.0 is a release nobody can consume, because
      # /api/health would answer a different number than the filename promises.
      - name: the tag is the version
        run: |
          manifest=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "tag ${GITHUB_REF_NAME} says ${GITHUB_REF_NAME#v}, Cargo.toml says $manifest" >&2
            exit 1
          fi
          echo "LocalCases $manifest"

      - uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `find -quit` is a BSD extension, so the guard counts with head instead
          # of asking find to stop early.
          first=$(find bundles -type f | head -1)
          if [ -z "$first" ]; then
            echo "no bundle came out of the desktop job" >&2
            exit 1
          fi

          # Names a README can link to. Tauri's own names differ per bundler and
          # carry the crate name; these say what is inside and for which machine.
          # The arch is the runner's: macOS bundles are Apple Silicon, not universal.
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for f in $(find bundles -type f | sort); do
            case "$f" in
              *.deb) cp "$f" "dist/LocalCases-$version-linux-amd64.deb" ;;
              *.zip) cp "$f" "dist/LocalCases-$version-macos-arm64.app.zip" ;;
              *.msi) cp "$f" "dist/LocalCases-$version-windows-x64.msi" ;;
              *) echo "unexpected bundle: $f" >&2; exit 1 ;;
            esac
          done
          (cd dist && sha256sum *) > SHA256SUMS
          cat SHA256SUMS
          # quoted delimiter: the notes talk about `LICENSE` and `dpkg -c`, and an
          # unquoted heredoc would run those backticks as commands
          cat > notes.md <<'MD'
          Offline search over your own corpus of court judgments: the engine, the CLI
          and a desktop window. Nothing is uploaded, there is no account, and this
          release carries no judgment corpus -- see the README on what importing one
          means you have agreed to.

          Each bundle carries `LICENSE`, `NOTICE` and `LICENSES.third-party.md`; on
          Linux, `dpkg -c` should show them under `usr/lib/LocalCases/`. The version
          in the window's About box is the version `/api/health` reports, and the
          shell's build script refuses to build when the two manifests disagree.
          `SHA256SUMS` covers the three bundles: `sha256sum -c SHA256SUMS`.
          MD
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # re-running the job of a tag replaces what it published instead of
            # failing on a release that already exists
            gh release upload "$GITHUB_REF_NAME" --clobber dist/* SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "LocalCases $GITHUB_REF_NAME" \
              --notes-file notes.md \
              dist/* SHA256SUMS
          fi

